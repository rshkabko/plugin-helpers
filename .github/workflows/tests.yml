name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php: '7.4'
            phpunit: '^9.6'
          - php: '8.3'
            phpunit: '^12.0'

    steps:
      # Into its own folder, required by path: a PR tests the PR, not main.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2

      # Plain PHP, no flamix/* dependencies: no Laravel, Satis or PACKAGES_TOKEN.
      - name: Install dependencies
        run: |
          mkdir app && cd app
          composer init --no-interaction --name=flamix/plugin-helpers-ci
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.package '{"type": "path", "url": "${{ github.workspace }}/package", "options": {"symlink": true}}'
          composer require --no-interaction flamix/plugin-helpers:@dev
          composer require --no-interaction --dev "phpunit/phpunit:${{ matrix.phpunit }}"

      # Symlinked package: ../../autoload.php from phpunit.xml resolves inside package/, hence --bootstrap.
      - name: Run tests
        working-directory: app
        run: >
          ./vendor/bin/phpunit ./vendor/flamix/plugin-helpers/tests
          --configuration ./vendor/flamix/plugin-helpers/phpunit.xml
          --bootstrap ./vendor/autoload.php
          --testdox
